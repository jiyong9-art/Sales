<style>
:root{
  --ink:#151a22;--sheet:#fff;--line:#dfe4ec;--soft:#f2f5fa;--mute:#5b6472;
  --brand:#003A84;--brand-deep:#00295d;--brand-soft:#eaf1fb;--on:#fff;
}
@media (prefers-color-scheme:dark){:root{--ink:#edf0f5;--sheet:#181c22;--line:#2c323c;--soft:#101318;--mute:#a7afbb;--brand:#3f7cd2;--brand-deep:#0a2545;--brand-soft:#16233a;--on:#fff}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--soft);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  display:flex;min-height:100dvh;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
  background-image:radial-gradient(120% 70% at 50% -10%,rgba(0,58,132,.10),transparent 62%);}
form{background:var(--sheet);border:1px solid var(--line);border-radius:22px;padding:26px 22px 22px;width:100%;max-width:372px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 18px 48px rgba(15,23,42,.10)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.hd img{width:44px;height:44px;border-radius:12px;display:block;box-shadow:0 2px 6px rgba(0,0,0,.16)}
.hd .ht{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hd .ht small{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--brand);text-transform:uppercase}
.hd h1{font-size:19px;margin:2px 0 0;letter-spacing:-.4px;font-weight:800}
.lead{margin:0;font-size:13.5px;color:var(--mute);line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:800;color:var(--mute)}
input[type=password],input[type=text]{font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--soft);color:var(--ink);width:100%;letter-spacing:.02em}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
label.opt{font-size:13.5px;display:flex;gap:9px;align-items:center;min-height:32px;color:var(--ink);font-weight:500}
label.opt input{width:19px;height:19px;accent-color:var(--brand);flex:none;margin:0}
button{font-size:16.5px;padding:14px;border:0;border-radius:13px;background:var(--brand);color:var(--on);font-weight:800;min-height:52px;letter-spacing:-.2px;box-shadow:0 6px 16px rgba(0,58,132,.22)}
button:active{background:var(--brand-deep)}
button:disabled{opacity:.55;box-shadow:none}
#msg{min-height:1.5em;font-size:13px;color:var(--mute);line-height:1.45}
#msg.err{color:#b3261e;font-weight:600}
.foot{font-size:11.5px;color:var(--mute);line-height:1.5;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="hd"><img src="icon.png" alt="에이원코리아"><div class="ht"><h1>에이원 영업 모바일</h1></div></div>
  <div class="field">
    <label for="uid">아이디</label>
    <input id="uid" type="text" value="a1korea" placeholder="a1korea" aria-label="아이디" autocomplete="username" autocapitalize="off" spellcheck="false" required>
  </div>
  <div class="field">
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password" required>
  </div>
  <label class="opt"><input id="show" type="checkbox"> 비밀번호 보이기</label>
  <label class="opt"><input id="keep" type="checkbox" checked> 이 폰에서는 다음부터 묻지 않기</label>
  <button id="go">열기</button>
  <div id="msg" role="status" aria-live="polite"></div>
  <p class="foot">고객·계약은 모두 가짜 시안 자료입니다. 파일은 비밀번호로 잠겨 있고, 이 폰에 열쇠를 남기지 않으려면 위 체크를 풀어 두세요.</p>
</form>
<script>
(() => {
  // 날인기(stamp)와 같은 잠금 방식 — app.enc = 암호문(AES-GCM), slot.json = 비밀번호로 연 열쇠
  const KEEP = "a1sales-key", KEEPPW = "a1-sales-pass2", b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), $ = id => document.getElementById(id);
  const msg = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
  let enc = null;
  const getEnc = () => enc || (enc = fetch("app.enc", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("file"); return r.arrayBuffer(); }));
  async function openWith(rawKey) {
    const buf = new Uint8Array(await getEnc());
    const k = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, k, buf.slice(12));
    const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open(); document.write(html); document.close();
  }
  async function unwrap(pw) {
    const s = await (await fetch("slot.json", { cache: "no-cache" })).json();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const wk = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(s.salt), iterations: s.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(s.iv) }, wk, b64(s.ct)));
  }
  $("show").onchange = () => { $("pw").type = $("show").checked ? "text" : "password"; };
  let saved = null; try { saved = localStorage.getItem(KEEP); } catch (e) {}
  if (saved) { msg("여는 중…"); openWith(b64(saved)).catch(() => { try { localStorage.removeItem(KEEP); localStorage.removeItem(KEEPPW); } catch (e) {} msg("비밀번호가 바뀌었어요. 새 비밀번호를 넣어 주세요.", true); }); }
  else getEnc().catch(() => {});
  // 비밀번호는 열쇠를 푸는 데만 쓰고 파일·기록에 남기지 않습니다. 다만 이 탭 안에서만 사는 sessionStorage에
  // 한 번 두어, 앱의 음성 오더(/api/sales/voice)가 x-a1-passcode 로 보낼 수 있게 합니다(탭을 닫으면 사라짐).
  const PW_K = "a1-sales-pass";
  const UID = "a1korea";   // v10.11 — 당분간 아이디도 a1korea (대소문자 무시)
  $("f").onsubmit = async e => {
    e.preventDefault();
    // 아이디 먼저 확인 — 비밀번호(잠금 열쇠)는 그대로 a1korea
    if (String($("uid").value || "").trim().toLowerCase() !== UID) { $("go").disabled = false; msg("아이디가 맞지 않아요. 아이디를 확인해 주세요.", true); $("uid").focus(); return; }
    $("go").disabled = true; msg("확인 중…");
    let raw;
    try { raw = await unwrap($("pw").value); } catch (err) { $("go").disabled = false; msg("비밀번호가 틀렸어요. 한/영 키와 대문자(Caps Lock)를 확인하세요.", true); return; }
    // '이 폰에서는 다시 묻지 않기' = 앱 열쇠와 함께 AI 호출용 비밀번호도 이 폰에만 둔다(서버·파일·기록에는 남기지 않음).
    //   그래야 오더 AI·음성인식이 비밀번호를 다시 묻지 않는다(v10.9).
    if ($("keep").checked) try { localStorage.setItem(KEEP, btoa(String.fromCharCode(...raw))); try { localStorage.setItem(KEEPPW, $("pw").value); } catch (e) {} } catch (e) {}
    if (!$("keep").checked) try { localStorage.removeItem(KEEPPW); } catch (e) {}
    try { sessionStorage.setItem(PW_K, $("pw").value); } catch (e) {}
    msg("여는 중…");
    try { await openWith(raw); } catch (err) { $("go").disabled = false; msg("열지 못했어요. 인터넷 연결을 확인해 주세요.", true); }
  };
})();
</script>
</body>
</html>
